services:
  postgres:
    image: postgres:16
    container_name: consolidador-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: consolidador
      POSTGRES_PASSWORD: consolidador
      POSTGRES_DB: consolidador
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consolidador -d consolidador"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
